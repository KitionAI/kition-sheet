format: 1
id: sheet.editor.format-font/golden-format
feature: sheet.editor.format-font
intent: >-
  The format painter and the font controls against the golden WPS cases (module M6 格式刷 and
  字体), in Chromium (`pnpm test:golden-format` runs WebKit as well): 开始 › 格式刷 left of Paste,
  a click painting once and a double-click painting until Esc or a second click, with the brush
  pointer; cells, dragged ranges (repeated over a larger range, cut to a smaller one), whole rows
  and columns, merged cells, number formats, another sheet, formula, link, validation, conditional
  format, note and cell-picture cells, undo and redo, save and reopen; 开始 › 字体 with its font
  box and list (search by name, initials or pinyin, Recently Used, each font in its own face, the
  cell's font checked), the size box and WPS's size list, Increase and Decrease Font Size stopping
  at 72 and 6, sizes 1–409 typed, bold, italic, underline and strikethrough with Cmd/Ctrl+B, I, U, 5
  and their tooltips, characters of a cell formatted on their own, font and fill colours with
  Recent Colors and More Colors, whole rows and columns, Cmd/Ctrl+click areas, filtered and hidden
  rows, copy, cut and paste, replace, sort, sheet copies, export and import, and read-only.
layer: gate
dimension: function
source:
  kind: probe
  from: web/tests/golden-format.mjs
  license: owned
input: []
steps:
  - exec:
      cmd: [pnpm, --dir, web, exec, node, tests/golden-format.mjs, chromium]
expected:
