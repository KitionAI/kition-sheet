feature: sheet.agent.ids
intent: >-
  A drawing object (shape, picture, chart, smart graphic, group) keeps the file's id (`cNvPr id`) when
  no other object of the workbook has it, and the writer saves each object's own id, so ids an
  agent read survive a save and a reopen; ids a file repeats across sheets become distinct once
  and then stay.
