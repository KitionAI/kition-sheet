feature: sheet.editor.formula-bar
intent: >-
  Alt+Enter (Option+Return) in the cell being typed entered it, as Enter does; WPS and Excel break
  the line. Now it breaks the line, the cell editor shows the lines (a click on the second puts the
  caret there), and Enter enters the text with the line break and turns on wrapping.
