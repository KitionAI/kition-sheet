format: 1
id: regressions/issue-freeze-scrolled-view
feature: sheet.editor.view-settings
intent: >-
  Freezing a scrolled view froze from row 1 and column A, so the frozen rows were the ones
  scrolled off above. WPS and Excel start the frozen panes at the view's top-left: rows above it
  and columns left of it stay out of view until the panes are unfrozen, and the file keeps where
  the panes start (sheetView topLeftCell). Carried from M5 into M6.
