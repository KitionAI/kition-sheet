id: regressions/issue-table-filter-buttons
feature: sheet.editor.filter-buttons
intent: >-
  A table's header buttons did nothing (module M7, TS-C102): `data.filterBy` only knew the
  sheet's AutoFilter, so a table could not be filtered from its header and pressing a button
  opened nothing. A table now keeps its own criteria and the button opens the editor's list.
