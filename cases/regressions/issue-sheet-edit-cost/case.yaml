format: 1
id: regressions/issue-sheet-edit-cost
feature: sheet.file.workbooks
intent: >-
  Editing one cell costs about the same however long the workbook is (rule P1): the bridge writes
  only what the edit touched and does not read every row's and column's position again for each
  edit. Measured on 2026-11-24, one cell's edit took 1.0 ms at 10,000 cells and 1,192 ms at a
  million, almost all of it the bridge's own diff and position reads; a sheet a hundred times
  longer must not make an edit more than about four times slower.
layer: gate
dimension: performance
source:
  kind: issue
  from: kition-plan plans/2026-11-24-plain-model-design.md section 10
  license: owned
input: []
steps:
  - cargo-test:
      package: kdm-model
      test: perf_scale
      filter: one_cells_edit_costs_the_same_in_a_hundred_times_longer_sheet
expected:
  - actual: out:cargo-test
    compare: exit
    value: 0
since: "2026-11-25"
