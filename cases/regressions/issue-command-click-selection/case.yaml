id: regressions/issue-command-click-selection
feature: sheet.editor.format-font
intent: >-
  Cmd+click (Ctrl+click) on a cell replaced the selection, so several separate areas could not be
  selected with the mouse and formatted at once. It now adds the cell (a drag from it a range) as
  WPS and Excel do (FONT-C29, FONT-C106).
