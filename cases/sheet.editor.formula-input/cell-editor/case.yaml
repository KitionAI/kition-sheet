intent: >-
  The cell editor's tool: a press, a drag, Shift and the arrows point at cells and headings and
  insert their references (a dashed frame round the range), another sheet's cells with its quoted
  name; F4 cycles the reference at the caret; the function list and the argument hint follow the
  caret, Up and Down choose, Tab and editor.acceptFunction take a function; the formula bar's F4
  and hint come from editor.cycleReference and editor.formula.
