format: 1
id: sheet.platform.file-changed-outside/merge-into-replica
feature: sheet.platform.file-changed-outside
intent: >-
  A workbook changed by another program while it was closed opens with the replica the host
  stored at its last save (replicaMergesFile, Kit UI protocol UI-R1): the outside change shows,
  the edits of the last save stay, the replica keeps its id and records the file as one import
  after the stored version, and the sheets' and rows' object ids survive. When the other program
  kept xl/kition/identities.json the file's ids and the replica's agree; when it dropped the part
  the ids come back from the stored replica, while the same file opened alone gets another
  replica whose ids are made from positions. Undo steps belong to the session and are not
  expected after a reopen.
layer: gate
dimension: data-safety
source:
  kind: synthetic
  from: web/tests/reopen-changed.mjs
  license: owned
input: []
steps:
  - exec:
      cmd: [pnpm, --dir, web, exec, node, tests/reopen-changed.mjs, chromium]
  - exec:
      cmd: [pnpm, --dir, web, exec, node, tests/reopen-changed.mjs, webkit]
expected:
  - actual: out:exec
    compare: exit
    value: 0
requires: [chromium, webkit]
timeout_s: 180
since: "2026-11-24"
