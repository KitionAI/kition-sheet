  symbols, closing on a second click or outside) and Symbol dialog (符号 and 特殊字符 tabs, name
  search, font, subset, code), symbols going in at the caret of what is typed, after a cell's text
  with the cell open, into a text box and a merged area, undone, saved and reopened; Insert ›
