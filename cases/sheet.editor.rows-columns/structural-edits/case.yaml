feature: sheet.editor.rows-columns
intent: >-
  The engine side of inserting and deleting lines (`row.insert {count, below}`,
  `column.insert {count, right}`, `row.delete`, `column.delete`): above, below,
  left and right with any count; every area of the selection; the new lines selected; formats
  from the line before (above, left) or after (below, right); conditional formats growing over
  lines inserted after them; validation, links and merges left where they were; frozen panes
  growing and shrinking but never unfrozen; hidden and grouped lines; filtered rows kept;
  formulas, merges and charts following; the whole sheet refused; and the editor's right-click
  (`editor.contextMenu`) selecting what it pressed.
