[workspace]
resolver = "3"
members = ["crates/*/*", "bindings/*", "tools/xtask"]
default-members = ["crates/*/*", "bindings/headless", "tools/xtask"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/KitionAI/kition-sheet"

[workspace.dependencies]
# kition-sdk, pinned by commit (one revision for every crate of it)
kition-convergence = { git = "https://github.com/KitionAI/kition-sdk", rev = "6b4d471603aebdde1ee23c1a1cc522f8bbd97883" }
kition-office-core = { git = "https://github.com/KitionAI/kition-sdk", rev = "6b4d471603aebdde1ee23c1a1cc522f8bbd97883" }
kition-headless = { git = "https://github.com/KitionAI/kition-sdk", rev = "6b4d471603aebdde1ee23c1a1cc522f8bbd97883" }
kition-kit-server = { git = "https://github.com/KitionAI/kition-sdk", rev = "6b4d471603aebdde1ee23c1a1cc522f8bbd97883" }
kition-kit = { git = "https://github.com/KitionAI/kition-sdk", rev = "6b4d471603aebdde1ee23c1a1cc522f8bbd97883" }
# The kits' MCP server's tools (kition-kits-mcp), for the headless kit's end-to-end tests.
kition-kits = { git = "https://github.com/KitionAI/kition-sdk", rev = "6b4d471603aebdde1ee23c1a1cc522f8bbd97883" }
kition-env = { git = "https://github.com/KitionAI/kition-sdk", rev = "6b4d471603aebdde1ee23c1a1cc522f8bbd97883" }
# A host of kit processes (`HeadlessKit`), for the `document.identity` tests.
kition-kit-host = { git = "https://github.com/KitionAI/kition-sdk", rev = "6b4d471603aebdde1ee23c1a1cc522f8bbd97883" }
# internal
kition-sheet-core = { path = "crates/engine/core" }
kition-sheet-numfmt = { path = "crates/engine/numfmt" }
kition-sheet-formula = { path = "crates/engine/formula" }
kition-sheet-functions = { path = "crates/engine/functions" }
kition-sheet-model = { path = "crates/engine/model" }
kition-sheet-calc = { path = "crates/engine/calc" }
kition-sheet-xlsx = { path = "crates/formats/xlsx" }
kition-sheet-chart = { path = "crates/engine/chart" }
kition-sheet-engine = { path = "crates/engine/engine" }
kition-sheet-pdf = { path = "crates/formats/pdf" }
kdm-model = { path = "crates/kdm/kdm-model" }
kurbo = "0.13"

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
rayon = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
quick-xml = "0.38"
zip = { version = "3", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Chinese (GBK / GB 18030) text files: the CSVs Excel and WPS save on Chinese Windows.
encoding_rs = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
